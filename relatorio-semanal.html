function cardHdr(helpKey, titulo) {
  return `<div class="card-hdr"><h3>${titulo}</h3><button class="help-btn" data-help="${helpKey}" aria-label="O que é isso?">?</button></div>`;
}

function fmt1(n) { return (Math.round(n*10)/10).toLocaleString('pt-BR'); }
function fmtDataHora(iso) {
  const d = new Date(iso.replace(' ', 'T'));
  if (isNaN(d)) return iso;
  const dd = String(d.getDate()).padStart(2,'0'), mm = String(d.getMonth()+1).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0'), mi = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm} ${hh}:${mi}`;
}
function pillClass(pct) { return pct >= 85 ? 'pill-bom' : pct >= 65 ? 'pill-alerta' : 'pill-critico'; }
function barColor(pct) { return pct >= 85 ? 'var(--bom)' : pct >= 65 ? 'var(--alerta)' : 'var(--critico)'; }

function renderKPIs() {
  const g = D.grupos.geral;
  const cob36 = D.cobertura['36h'];
  const totalFontes = Object.values(D.fontes_dado).reduce((a,b)=>a+b,0);
  const pctAna = totalFontes ? Math.round(100*(D.fontes_dado['ANA']||0)/totalFontes) : 0;
  const kpis = [
    ['Execuções', `${D.execucoes_realizadas}/${D.execucoes_esperadas}`, 'realizadas / esperadas'],
    ['Acurácia geral', g.acuracia_pct!=null ? g.acuracia_pct+'%' : '—', `MAE ${g.mae} m · ${g.n} horizontes`],
    ['Cobertura margem 36h', cob36.cobertura_pct!=null ? cob36.cobertura_pct+'%' : '—', 'meta ~95%'],
    ['Fonte ANA', pctAna+'%', 'do total de leituras'],
  ];
  document.getElementById('kpis').innerHTML = kpis.map(([l,v,s]) => `
    <div class="kpi"><div class="label">${l}</div><div class="valor">${v}</div><div class="sub">${s}</div></div>
  `).join('');
}

function barra(lbl, valor, total, cor) {
  const pct = total ? Math.max(Math.round(100*valor/total), 3) : 0;
  return `<div class="bar-row"><div class="lbl">${lbl}</div><div class="bar-track">
    <div class="bar-fill" style="width:${pct}%; background:${cor};">${valor}</div>
  </div></div>`;
}

function rankingTable(id, ranking, unidade=' m') {
  const rows = ranking.map(r => `
    <tr><td>${r.estacao}</td>
      <td class="num"><span class="pill ${pillClass(r.acuracia_pct)}">${r.acuracia_pct}%</span></td>
      <td class="num">${r.mae}${unidade}</td><td class="num">${r.vies>0?'+':''}${r.vies}${unidade}</td><td class="num">${r.n}</td></tr>
  `).join('');
  return `<table class="rank" id="${id}" data-rows='${JSON.stringify(ranking).replace(/'/g,"&apos;")}'>
    <thead><tr>
      <th data-key="estacao">Estação</th>
      <th class="num" data-key="acuracia_pct">Acurácia<span class="sort-arrow">▾</span></th>
      <th class="num" data-key="mae">MAE</th>
      <th class="num" data-key="vies">Viés</th>
      <th class="num" data-key="n">N</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

    <div class="card">${cardHdr('aviso-pontual', 'Aviso "pontual fora da faixa" — sinal real ou ruído?')}
      <p class="desc">${D.validacao_avisos_pontual.length ? '' : 'Sem aviso desse tipo com horizonte já vencido nesta janela — popula sozinho conforme mais execuções completam 120h.'}</p>
      ${D.validacao_avisos_pontual.length ? '<p>'+D.validacao_avisos_pontual.filter(a=>a.confirmado).length+'/'+D.validacao_avisos_pontual.length+' confirmados</p>' : ''}
    </div>
  `;

  // Fonte + método
  const totalFontes = Object.values(D.fontes_dado).reduce((a,b)=>a+b,0);
  const barrasFonte = Object.entries(D.fontes_dado).sort((a,b)=>b[1]-a[1])
    .map(([f,n]) => barra(f, n, totalFontes, f==='ANA' ? 'var(--bom)' : 'var(--alerta)')).join('');
  const totalOrigem = Object.values(D.origens_geral).reduce((a,b)=>a+b,0);
  const barrasOrigem = Object.entries(D.origens_geral).sort((a,b)=>b[1]-a[1])
    .map(([o,n]) => {
      const cor = o.includes('Ajuste 7 (emp') && !o.includes('deriv') ? 'var(--bom)' : (o==='sem dado' || o.includes('baixa confian')) ? 'var(--critico)' : 'var(--alerta)';
      return barra(ROTULOS_ORIGEM[o] || o.slice(0,38), n, totalOrigem, cor);
    }).join('');
  const dur = D.duracoes_segundos;
  const durHtml = dur.length ? `<div class="kpi-mini"><div class="l">Tempo médio</div><div class="v">${Math.round(dur.reduce((a,b)=>a+b,0)/dur.length)}s</div><div class="s">${Math.round(Math.min(...dur))}s–${Math.round(Math.max(...dur))}s, n=${dur.length}</div></div>` :
    `<div class="kpi-mini"><div class="l">Tempo médio</div><div class="v" style="font-size:14px; color:var(--text-3);">instrumentação nova</div></div>`;
  panels['eficiencia'] = `
    <div class="card">${cardHdr('fonte-dado', 'De onde veio o dado ao vivo')}${barrasFonte}</div>
    <div class="card">${cardHdr('metodo-calculo', 'Método de cálculo usado (todas as estações)')}${barrasOrigem}</div>
    <div class="card">${cardHdr('tempo-execucao', 'Tempo de execução')}<div class="kpi-mini-row">${durHtml}</div></div>
  `;

  // Cadência + avisos
  const gapsHtml = D.gaps.length ? '<ul class="lista-limpa">'+D.gaps.map(g=>`<li>${fmtDataHora(g)}</li>`).join('')+'</ul>' : '<p class="desc">✓ nenhum horário faltando</p>';
  const avisosOrdenados = Object.entries(D.avisos_resumo).sort((a,b)=>b[1]-a[1]);
  const avisosHtml = avisosOrdenados.length ? avisosOrdenados.map(([chave,n]) => {
    const [tipo, estacao] = chave.split('|');
    return `<div class="bar-row"><div class="lbl">${estacao} — ${tipo}</div><div style="font-family:var(--font-mono); font-size:12px; color:var(--text-2);">${n}x</div></div>`;
  }).join('') : '<p class="desc">✓ nenhum aviso nesta janela</p>';
  panels['cadencia'] = `
    <div class="card">${cardHdr('cadencia', 'Cadência de execução')}
      <p class="desc">${D.execucoes_realizadas}/${D.execucoes_esperadas} esperadas${D.execucoes_extras ? ' · +'+D.execucoes_extras+' extra(s) fora do padrão' : ''}</p>
      ${D.gaps.length ? '<p class="desc" style="font-weight:600;">Horários sem execução:</p>'+gapsHtml : gapsHtml}
    </div>
    <div class="card">${cardHdr('avisos-validacao', 'Avisos de validação automática')}${avisosHtml}</div>
  `;

  document.getElementById('panels').innerHTML = Object.entries(panels).map(([id,html]) =>
    `<div class="panel" id="panel-${id}">${html}</div>`).join('');
}

function renderTabs() {
  const tabs = [
    ['pxr', 'Previsto x realizado'],
    ['cobertura', 'Cobertura da margem'],
    ['chance', 'Chance por cota'],
    ['eficiencia', 'Eficiência'],
    ['cadencia', 'Cadência e avisos'],
  ];
  document.getElementById('tabs').innerHTML = tabs.map(([id,lbl], i) =>
    `<button class="tab-btn${i===0?' active':''}" data-tab="${id}">${lbl}</button>`).join('');
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    });
  });
  document.getElementById('panel-'+tabs[0][0]).classList.add('active');
}

function attachSort() {
  document.querySelectorAll('table.rank[data-rows]').forEach(table => {
    let rows = JSON.parse(table.dataset.rows.replace(/&apos;/g, "'"));
    let sortKey = 'acuracia_pct', asc = false;
    const tbody = table.querySelector('tbody');
    function redraw() {
      const sorted = [...rows].sort((a,b) => asc ? (a[sortKey]>b[sortKey]?1:-1) : (a[sortKey]<b[sortKey]?1:-1));
      tbody.innerHTML = sorted.map(r => `
        <tr><td>${r.estacao}</td>
          <td class="num"><span class="pill ${pillClass(r.acuracia_pct)}">${r.acuracia_pct}%</span></td>
          <td class="num">${r.mae} m</td><td class="num">${r.vies>0?'+':''}${r.vies} m</td><td class="num">${r.n}</td></tr>
      `).join('');
    }
    table.querySelectorAll('th[data-key]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        asc = (sortKey === key) ? !asc : false;
        sortKey = key;
        redraw();
      });
    });
  });
}

function attachHelp() {
  document.querySelectorAll('.help-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const info = HELP[btn.dataset.help];
      if (!info) return;
      document.getElementById('helpTitulo').textContent = info.titulo;
      document.getElementById('helpOQue').textContent = info.oQue;
      document.getElementById('helpComoInterpretar').textContent = info.comoInterpretar;
      document.getElementById('helpBackdrop').classList.add('show');
    });
  });
}
const helpBackdrop = document.getElementById('helpBackdrop');
document.getElementById('helpClose').addEventListener('click', () => helpBackdrop.classList.remove('show'));
helpBackdrop.addEventListener('click', (e) => { if (e.target === helpBackdrop) helpBackdrop.classList.remove('show'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') helpBackdrop.classList.remove('show'); });

renderKPIs();
renderPanels();
renderTabs();
attachSort();
attachHelp();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
window.addEventListener("load", function () {
  try {
    var modoApp = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
      || window.navigator.standalone === true;
    if (modoApp && window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({ path: "/app-open", title: "App aberto (modo standalone)", event: true });
    }
  } catch (e) {}
});
(function () {
  var CARD_LARGURA = 640;
  var card = document.getElementById("horizonte-card");
  if (!card) return;
  // 24 = padding:24px 12px do <td align="center"> que envolve o card em
  // gerar_email_execucao.py (12px de cada lado) - não dá pra medir isso
  // dinamicamente pelo parentElement porque, antes do zoom ser aplicado,
  // a tabela externa (sem table-layout:fixed) já cresceu pra caber o
  // card no tamanho natural de 640px, tornando a medida circular.
  var PADDING_LATERAL = 24;
  // 06/09/2026 - inverso exato do aumento de fonte do commit 5b66a30
  // (+35%, pensado pro celular/app). Abaixo de CARD_LARGURA (celular),
  // o zoom-to-fit de sempre já compensa isso de graça, proporcionalmente
  // - comportamento intacto. Em telas maiores (desktop), sem esse
  // encolhimento extra o texto herdava o tamanho já aumentado sem
  // nenhuma compensação (achado do usuário) - agora aplica um zoom fixo
  // que devolve o tamanho efetivo de texto de antes do aumento.
  var FATOR_AUMENTO_FONTE_MOBILE = 1.35;
  function ajustarEscala() {
    var disponivel = document.documentElement.clientWidth - PADDING_LATERAL;
    var escala = disponivel < CARD_LARGURA
      ? disponivel / CARD_LARGURA
      : 1 / FATOR_AUMENTO_FONTE_MOBILE;
    card.style.zoom = escala;
  }
  ajustarEscala();
  window.addEventListener("resize", ajustarEscala);
})();
</script>
